<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team Carousel | CodeByGaurav</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>
    <h1 class="about-title">Our Team</h1>
    <div class="carousel-container">
        <button class="nav-arrow left"><i class="ri-arrow-left-s-line"></i></button>
        <div class="carousel-track">
            <div class="card" data-index="0">
                <img src="images/1.avif" alt="Team Member 1">
            </div>
            <div class="card" data-index="1">
                <img src="images/2.avif" alt="Team Member 2">
            </div>
            <div class="card" data-index="2">
                <img src="images/3.avif" alt="Team Member 3">
            </div>
            <div class="card" data-index="3">
                <img src="images/4.avif" alt="Team Member 4">
            </div>
            <div class="card" data-index="4">
                <img src="images/5.avif" alt="Team Member 5">
            </div>
            <div class="card" data-index="5">
                <img src="images/6.avif" alt="Team Member 6">
            </div>
        </div>
        <button class="nav-arrow right"><i class="ri-arrow-right-s-line"></i></button>
    </div>

    <div class="member-info">
        <h2 class="member-name">David Kim</h2>
        <p class="member-role">Founder</p>
    </div>

    <div class="dots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
        <div class="dot" data-index="3"></div>
        <div class="dot" data-index="4"></div>
        <div class="dot" data-index="5"></div>
    </div>

</body>
<script src="script.js"></script>

</html>
